name: Wayfinder Intelligence CI

on:
  push:
    paths:
      - "supabase/functions/_shared/intelligence/**"
      - "supabase/functions/birth-context/**"
      - "supabase/functions/natal-geometry/**"
      - "supabase/functions/initial-position/**"
      - "supabase/functions/wayfinder-state/**"
      - "supabase/functions/semantic-admission/**"
      - "supabase/functions/navigator-chat/**"
      - "lab/birth-context-vertical-slice-v0.1.test.ts"
      - "lab/natal-geometry-v0.1.test.ts"
      - "lab/requirements-v0.1.test.ts"
      - "lab/initial-position-discovery-v0.1.test.ts"
      - "lab/semantic-admission-training-v0.1.test.ts"
      - "lab/semantic-compiler-v0.1.test.ts"
      - "lab/semantic-live-runtime-v0.1.test.ts"
      - "lab/semantic-safety-normalization-v0.1.test.ts"
      - "lab/semantic-episode-v0.1.test.ts"
      - "lab/semantic-resolution-context-v0.2.test.ts"
      - "lab/model-provider-resilience-v0.1.test.ts"
      - "lab/navigator-canonical-context-v0.1.test.ts"
      - "lab/admission-planner-v0.1.test.ts"
      - "lab/admission-fulfillment-v0.1.test.ts"
      - "lab/schedule-direction-fulfillment-v0.1.test.ts"
      - "lab/nutrition-v0.1.test.ts"
      - "lab/recomputation-loop-v0.1.test.ts"
      - "lab/requirements-character-v0.1.test.ts"
      - "lab/might-growth-evidence-v0.1.test.ts"
      - "lab/voyage-progression-v0.1.test.ts"
      - "lab/domain-standards-v0.1.test.ts"
      - ".github/workflows/intelligence-ci.yml"
  pull_request:
    paths:
      - "supabase/functions/_shared/intelligence/**"
      - "supabase/functions/birth-context/**"
      - "supabase/functions/natal-geometry/**"
      - "supabase/functions/initial-position/**"
      - "supabase/functions/wayfinder-state/**"
      - "supabase/functions/semantic-admission/**"
      - "supabase/functions/navigator-chat/**"
      - "lab/birth-context-vertical-slice-v0.1.test.ts"
      - "lab/natal-geometry-v0.1.test.ts"
      - "lab/requirements-v0.1.test.ts"
      - "lab/initial-position-discovery-v0.1.test.ts"
      - "lab/semantic-admission-training-v0.1.test.ts"
      - "lab/semantic-compiler-v0.1.test.ts"
      - "lab/semantic-live-runtime-v0.1.test.ts"
      - "lab/semantic-safety-normalization-v0.1.test.ts"
      - "lab/semantic-episode-v0.1.test.ts"
      - "lab/semantic-resolution-context-v0.2.test.ts"
      - "lab/navigator-canonical-context-v0.1.test.ts"
      - "lab/admission-planner-v0.1.test.ts"
      - "lab/admission-fulfillment-v0.1.test.ts"
      - "lab/schedule-direction-fulfillment-v0.1.test.ts"
      - "lab/nutrition-v0.1.test.ts"
      - "lab/recomputation-loop-v0.1.test.ts"
      - "lab/requirements-character-v0.1.test.ts"
      - "lab/might-growth-evidence-v0.1.test.ts"
      - "lab/voyage-progression-v0.1.test.ts"
      - "lab/domain-standards-v0.1.test.ts"
      - ".github/workflows/intelligence-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check birth context Edge Function
        run: deno check supabase/functions/birth-context/index.ts
      - name: Type-check natal geometry Edge Function
        run: deno check supabase/functions/natal-geometry/index.ts
      - name: Type-check initial Position Edge Function
        run: deno check supabase/functions/initial-position/index.ts
      - name: Type-check Wayfinder State Edge Function
        run: deno check supabase/functions/wayfinder-state/index.ts
      - name: Type-check semantic admission Edge Function
        run: deno check supabase/functions/semantic-admission/index.ts
      - name: Type-check Navigator chat Edge Function
        run: deno check supabase/functions/navigator-chat/index.ts
      - name: Type-check requirement evaluator
        run: deno check supabase/functions/_shared/intelligence/requirements.ts
      - name: Type-check Requirement + Character + Voyage projections
        run: deno check supabase/functions/_shared/intelligence/requirement-providers.ts supabase/functions/_shared/intelligence/character-projection.ts supabase/functions/_shared/intelligence/voyage-progression.ts
      - name: Type-check Semantic Compiler runtime
        run: deno check supabase/functions/_shared/intelligence/semantic-compiler.ts supabase/functions/_shared/intelligence/concept-registry.ts supabase/functions/_shared/intelligence/concept-resolution.ts supabase/functions/_shared/intelligence/context-needs.ts supabase/functions/_shared/intelligence/entity-lifting.ts supabase/functions/_shared/intelligence/source-context-reconciliation.ts supabase/functions/_shared/intelligence/semantic-safety-normalization.ts supabase/functions/_shared/intelligence/wayfinder-capacity.ts supabase/functions/_shared/intelligence/live-semantic-reasoner.ts supabase/functions/_shared/intelligence/context-assembler.ts supabase/functions/_shared/intelligence/semantic-episode.ts supabase/functions/_shared/intelligence/admission-planner.ts supabase/functions/_shared/intelligence/admission-fulfillment.ts supabase/functions/_shared/intelligence/direction-semantic.ts supabase/functions/_shared/intelligence/schedule-semantic.ts supabase/functions/_shared/intelligence/nutrition-semantic.ts supabase/functions/_shared/intelligence/standard-semantic.ts supabase/functions/_shared/intelligence/training-exercises.ts
      - name: Run birth context vertical slice tests
        run: deno test lab/birth-context-vertical-slice-v0.1.test.ts
      - name: Run natal geometry tests
        run: deno test lab/natal-geometry-v0.1.test.ts
      - name: Run requirement contract tests
        run: deno test lab/requirements-v0.1.test.ts
      - name: Run initial Position discovery tests
        run: deno test lab/initial-position-discovery-v0.1.test.ts
      - name: Run Semantic Admission + Training tests
        run: deno test lab/semantic-admission-training-v0.1.test.ts
      - name: Run Semantic Compiler + Capacity Lab tests
        run: deno test lab/semantic-compiler-v0.1.test.ts
      - name: Run live semantic runtime boundary tests
        run: deno test lab/semantic-live-runtime-v0.1.test.ts
      - name: Run semantic concept + context resolution v0.2 tests
        run: deno test lab/semantic-resolution-context-v0.2.test.ts
      - name: Run semantic episode tests
        run: deno test lab/semantic-episode-v0.1.test.ts
      - name: Run model provider resilience tests
        run: deno test lab/model-provider-resilience-v0.1.test.ts
      - name: Run Navigator canonical context tests
        run: deno test lab/navigator-canonical-context-v0.1.test.ts
      - name: Run Admission Planner tests
        run: deno test lab/admission-planner-v0.1.test.ts
      - name: Run Admission Fulfillment tests
        run: deno test lab/admission-fulfillment-v0.1.test.ts
      - name: Run Schedule + Direction fulfillment tests
        run: deno test lab/schedule-direction-fulfillment-v0.1.test.ts
      - name: Run Nutrition v0.1 tests
        run: deno test lab/nutrition-v0.1.test.ts
      - name: Run recomputation loop tests
        run: deno test lab/recomputation-loop-v0.1.test.ts
      - name: Run Requirements + Character tests
        run: deno test lab/requirements-character-v0.1.test.ts
      - name: Run Might growth evidence tests
        run: deno test lab/might-growth-evidence-v0.1.test.ts
      - name: Run Voyage progression tests
        run: deno test lab/voyage-progression-v0.1.test.ts
      - name: Run governed domain Standard tests
        run: deno test lab/domain-standards-v0.1.test.ts
      - name: Run semantic entity lifting tests
        run: deno test lab/semantic-entity-lifting-v0.1.test.ts
      - name: Run source-context reconciliation tests
        run: deno test lab/source-context-reconciliation-v0.1.test.ts
      - name: Run semantic safety normalization tests
        run: deno test lab/semantic-safety-normalization-v0.1.test.ts
      - name: Run player-attributed effect preservation tests
        run: deno test lab/player-attributed-effect-v0.1.test.ts
