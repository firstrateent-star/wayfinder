name: Wayfinder Intelligence CI

on:
  push:
    paths:
      - "supabase/functions/_shared/intelligence/**"
      - "supabase/functions/birth-context/**"
      - "supabase/functions/natal-geometry/**"
      - "supabase/functions/initial-position/**"
      - "supabase/functions/semantic-admission/**"
      - "supabase/functions/navigator-chat/**"
      - "lab/birth-context-vertical-slice-v0.1.test.ts"
      - "lab/natal-geometry-v0.1.test.ts"
      - "lab/requirements-v0.1.test.ts"
      - "lab/initial-position-discovery-v0.1.test.ts"
      - "lab/semantic-admission-training-v0.1.test.ts"
      - "lab/semantic-compiler-v0.1.test.ts"
      - "lab/semantic-live-runtime-v0.1.test.ts"
      - "lab/semantic-resolution-context-v0.2.test.ts"
      - "lab/model-provider-resilience-v0.1.test.ts"
      - ".github/workflows/intelligence-ci.yml"
  pull_request:
    paths:
      - "supabase/functions/_shared/intelligence/**"
      - "supabase/functions/birth-context/**"
      - "supabase/functions/natal-geometry/**"
      - "supabase/functions/initial-position/**"
      - "supabase/functions/semantic-admission/**"
      - "supabase/functions/navigator-chat/**"
      - "lab/birth-context-vertical-slice-v0.1.test.ts"
      - "lab/natal-geometry-v0.1.test.ts"
      - "lab/requirements-v0.1.test.ts"
      - "lab/initial-position-discovery-v0.1.test.ts"
      - "lab/semantic-admission-training-v0.1.test.ts"
      - "lab/semantic-compiler-v0.1.test.ts"
      - "lab/semantic-live-runtime-v0.1.test.ts"
      - "lab/semantic-resolution-context-v0.2.test.ts"
      - ".github/workflows/intelligence-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check birth context Edge Function
        run: deno check supabase/functions/birth-context/index.ts
      - name: Type-check natal geometry Edge Function
        run: deno check supabase/functions/natal-geometry/index.ts
      - name: Type-check initial Position Edge Function
        run: deno check supabase/functions/initial-position/index.ts
      - name: Type-check semantic admission Edge Function
        run: deno check supabase/functions/semantic-admission/index.ts
      - name: Type-check Navigator chat Edge Function
        run: deno check supabase/functions/navigator-chat/index.ts
      - name: Type-check requirement evaluator
        run: deno check supabase/functions/_shared/intelligence/requirements.ts
      - name: Type-check Semantic Compiler runtime
        run: deno check supabase/functions/_shared/intelligence/semantic-compiler.ts supabase/functions/_shared/intelligence/concept-registry.ts supabase/functions/_shared/intelligence/concept-resolution.ts supabase/functions/_shared/intelligence/context-needs.ts supabase/functions/_shared/intelligence/entity-lifting.ts supabase/functions/_shared/intelligence/source-context-reconciliation.ts supabase/functions/_shared/intelligence/semantic-safety-normalization.ts supabase/functions/_shared/intelligence/wayfinder-capacity.ts supabase/functions/_shared/intelligence/live-semantic-reasoner.ts supabase/functions/_shared/intelligence/context-assembler.ts
      - name: Run birth context vertical slice tests
        run: deno test lab/birth-context-vertical-slice-v0.1.test.ts
      - name: Run natal geometry tests
        run: deno test lab/natal-geometry-v0.1.test.ts
      - name: Run requirement contract tests
        run: deno test lab/requirements-v0.1.test.ts
      - name: Run initial Position discovery tests
        run: deno test lab/initial-position-discovery-v0.1.test.ts
      - name: Run Semantic Admission + Training tests
        run: deno test lab/semantic-admission-training-v0.1.test.ts
      - name: Run Semantic Compiler + Capacity Lab tests
        run: deno test lab/semantic-compiler-v0.1.test.ts
      - name: Run live semantic runtime boundary tests
        run: deno test lab/semantic-live-runtime-v0.1.test.ts
      - name: Run semantic concept + context resolution v0.2 tests
        run: deno test lab/semantic-resolution-context-v0.2.test.ts
      - name: Run model provider resilience tests
        run: deno test lab/model-provider-resilience-v0.1.test.ts
      - name: Run semantic entity lifting tests
        run: deno test lab/semantic-entity-lifting-v0.1.test.ts
      - name: Run source-context reconciliation tests
        run: deno test lab/source-context-reconciliation-v0.1.test.ts
      - name: Run semantic safety normalization tests
        run: deno test lab/semantic-safety-normalization-v0.1.test.ts
